image: registry.gitlab.com/krispcall/krispcall-design-system:base

services:
  - name: docker:dind
    command: ["--tls=false", "--host=tcp://0.0.0.0:2375"]

variables:
  DOCKER_HOST: tcp://docker:2375/
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  CI_DOCKER_REPO: registry.gitlab.com/krispcall/krispcall-design-system
  DOCKERFILE_NAME: Dockerfile.prod

default:
  tags:
    - design-system-runner
    # - crm-docker
    # - krispcall-design-system-runner-casdoor
    # - krispcall-design-system-runner-refactor-server
    # - design-system-runner-casdoor
    # - casdoor-server-runner-design-system


stages:
  - build_docker_image
  - deploy

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "developer"
      variables:
        IMAGE_SUFFIX: 'DEV.$CI_COMMIT_SHORT_SHA'

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

build_react_app:
  stage: build_docker_image
  # before_script:
  #   - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY  # If image is private
  script:
    - echo "Building React App..."
    - npm install
    - npm run build
    - cp -r build/* .
    - export IMAGE_TAG="${CI_COMMIT_REF_NAME}-${CI_COMMIT_SHORT_SHA}"
    - DOCKER_BUILDKIT=1 docker build -t $CI_DOCKER_REPO:$IMAGE_TAG . -f ${DOCKERFILE_NAME}
    - docker push $CI_DOCKER_REPO:$IMAGE_TAG